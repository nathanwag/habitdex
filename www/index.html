<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hábitos</title>
<meta name="description" content="Marque seus hábitos do dia e receba lembrete dos que faltam.">
<meta name="theme-color" content="#111723" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f6fb" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="topbar-back" type="button" aria-label="Voltar" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <h1 class="topbar__title" id="topbar-title">Hábitos</h1>
  <div class="topbar__actions" id="topbar-actions"></div>
</header>

<main class="view" id="view" tabindex="-1"></main>

<nav class="tabs" id="tabs" aria-label="Principal">
  <a href="#/time" data-tab="/time">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.4.2 4 1.9 4.5 4.5"/></svg>Time</a>
  <a href="#/pokedex" data-tab="/pokedex">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="9" cy="8" r="2"/><path d="M8 14h8M8 17h5"/></svg>Dex</a>
  <a class="tabs__ball" href="#/" data-tab="/" aria-label="Hoje">
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M3 20a17 17 0 0 1 34 0z" fill="#ee4035" stroke="none"/><path d="M3 20a17 17 0 0 0 34 0z" fill="#fff" stroke="none"/><circle cx="20" cy="20" r="17" fill="none" stroke="#1f2a3a" stroke-width="2.5"/><path d="M3 20h34" stroke="#1f2a3a" stroke-width="2.5"/><circle cx="20" cy="20" r="5.5" fill="#fff" stroke="#1f2a3a" stroke-width="2.5"/></svg></a>
  <a href="#/ginasios" data-tab="/ginasios">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 4.5v9L12 22l-8-6.5v-9z"/><path d="M12 8v6"/></svg>Liga</a>
  <a href="#/ajustes" data-tab="/ajustes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</a>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__backdrop" data-close-sheet></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheet-title"></h2>
      <button class="icon-btn" type="button" data-close-sheet aria-label="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet__body" id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
